# ============================================================
# application.properties — perfil padrao (banco H2 embutido)
#
# Este e o perfil ativo quando voce roda a aplicacao sem
# especificar nada (mvn spring-boot:run). Nao exige nenhuma
# instalacao: o H2 roda em memoria dentro do proprio processo
# Java. Os dados sao recriados a cada reinicio da aplicacao a
# partir de schema.sql + data.sql (pasta src/main/resources).
#
# Para usar MySQL (por exemplo, o mesmo banco configurado nas
# Etapas 6/7) em vez do H2, veja application-mysql.properties e
# o README.md deste modulo.
# ============================================================

spring.application.name=controle-financeiro-web
server.port=8080

spring.datasource.url=jdbc:h2:mem:controlefinanceiro;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Executa schema.sql e data.sql automaticamente a cada inicializacao.
# Faz sentido para o H2 em memoria (precisa recriar tudo toda vez).
spring.sql.init.mode=always

# Console web do H2, util para inspecionar as tabelas durante o
# desenvolvimento: http://localhost:8080/h2-console
# (JDBC URL para conectar no console: a mesma de spring.datasource.url acima)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

logging.level.com.controlefinanceiro=INFO
