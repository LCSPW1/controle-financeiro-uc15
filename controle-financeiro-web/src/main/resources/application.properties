spring.application.name=controle-financeiro-web
server.port=8080

spring.datasource.url=jdbc:mysql://localhost:3306/controle_financeiro?useSSL=false&serverTimezone=UTC
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
