# ============================================================
# application-mysql.properties \u00e2\u0080\u0094 perfil opcional (MySQL real)
#
# Para ativar: rode com
#   mvn spring-boot:run -Dspring-boot.run.profiles=mysql
# ou defina a variavel de ambiente SPRING_PROFILES_ACTIVE=mysql
#
# Antes de usar, crie o banco e as tabelas uma vez, executando
# manualmente o conteudo de schema.sql (e data.sql, se quiser as
# categorias padrao) no seu MySQL - por exemplo, pelo MySQL
# Workbench, DBeaver ou linha de comando:
#   mysql -u root -p controle_financeiro < src/main/resources/schema.sql
#   mysql -u root -p controle_financeiro < src/main/resources/data.sql
#
# spring.sql.init.mode=never aqui de proposito: diferente do H2 em
# memoria, um banco MySQL real e persistente entre execucoes, entao
# nao queremos tentar recriar as tabelas (ou reinserir as categorias
# duplicadas) toda vez que a aplicacao inicia.
# ============================================================

spring.datasource.url=jdbc:mysql://localhost:3306/controle_financeiro?useSSL=false&serverTimezone=UTC
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=Coxinh@12

spring.sql.init.mode=never
spring.h2.console.enabled=false
