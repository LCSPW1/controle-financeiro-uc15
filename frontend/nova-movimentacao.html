<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nova movimentação — Controle Financeiro</title>
<link rel="stylesheet" href="css/reset.css">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/forms.css">
</head>
<body>

<div class="app-shell">
  <nav class="app-nav">
    <div class="mark">
      <div class="brand-mark" aria-hidden="true"></div>
      <span>Controle Financeiro</span>
    </div>
    <div class="user-menu">
      <span>Olá, <strong id="nome-usuario">—</strong></span>
      <button class="btn btn-secondary" id="btn-sair" type="button">Sair</button>
    </div>
  </nav>

  <main class="app-main narrow">
    <a href="dashboard.html" class="back-link">← Voltar ao painel</a>

    <div class="card" style="padding: var(--space-6);">
      <h1 style="margin-bottom: var(--space-1);">Nova movimentação</h1>
      <p class="text-muted" style="margin-bottom: var(--space-6);">Registre uma entrada ou saída do seu mês.</p>

      <div class="alert alert-error" id="alert-erro" role="alert"></div>

      <form id="form-movimentacao" novalidate>
        <div class="type-toggle" role="radiogroup" aria-label="Tipo de movimentação">
          <label class="type-option">
            <input type="radio" name="tipo" id="tipo-entrada" value="ENTRADA" checked>
            <span>↑ Entrada</span>
          </label>
          <label class="type-option">
            <input type="radio" name="tipo" id="tipo-saida" value="SAIDA">
            <span>↓ Saída</span>
          </label>
        </div>

        <div class="field" id="field-valor">
          <label for="valor">Valor</label>
          <div class="value-prefix">
            <span>R$</span>
            <input type="text" inputmode="decimal" id="valor" name="valor" placeholder="0,00">
          </div>
          <p class="error-message"></p>
        </div>

        <div class="field" id="field-descricao">
          <label for="descricao">Descrição</label>
          <input type="text" id="descricao" name="descricao" placeholder="Ex.: Supermercado, Salário do mês...">
          <p class="error-message"></p>
        </div>

        <div class="field" id="field-categoria">
          <label for="categoria">Categoria</label>
          <select id="categoria" name="categoria">
            <option value="0">Selecione...</option>
          </select>
          <p class="error-message"></p>
        </div>

        <div class="form-actions">
          <a href="dashboard.html" class="btn btn-secondary">Cancelar</a>
          <button type="submit" class="btn btn-primary">Salvar movimentação</button>
        </div>
      </form>
    </div>
  </main>
</div>

<script src="js/storage.js"></script>
<script src="js/validation.js"></script>
<script src="js/nova-movimentacao.js"></script>
</body>
</html>
