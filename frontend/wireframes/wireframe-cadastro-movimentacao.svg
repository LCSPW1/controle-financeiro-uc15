<svg viewBox="0 0 900 600" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="900" height="600" fill="#ffffff"/>
  <rect x="1" y="1" width="898" height="598" fill="none" stroke="#999" stroke-width="1"/>

  <text x="20" y="26" font-size="13" fill="#999">wireframe · 04 · nova-movimentacao.html</text>

  <!-- nav simplificada -->
  <rect x="20" y="45" width="860" height="50" fill="#eee" stroke="#888" stroke-width="1.5"/>
  <text x="40" y="76" font-size="13" fill="#777">← Voltar ao painel</text>

  <!-- card central -->
  <rect x="230" y="130" width="440" height="430" fill="#ffffff" stroke="#888" stroke-width="1.5"/>
  <text x="260" y="175" font-size="22" fill="#333">Nova movimentação</text>
  <line x1="260" y1="195" x2="640" y2="195" stroke="#ccc"/>

  <!-- toggle entrada/saida -->
  <rect x="260" y="215" width="180" height="42" fill="#ddd" stroke="#777" stroke-width="1.5"/>
  <text x="305" y="241" font-size="12" fill="#555">[ Entrada ]</text>
  <rect x="450" y="215" width="180" height="42" fill="#f2f2f2" stroke="#999"/>
  <text x="495" y="241" font-size="12" fill="#888">Saída</text>

  <text x="260" y="292" font-size="13" fill="#666">Label: Valor (R$)</text>
  <rect x="260" y="302" width="370" height="42" fill="#f2f2f2" stroke="#999"/>

  <text x="260" y="368" font-size="13" fill="#666">Label: Descrição</text>
  <rect x="260" y="378" width="370" height="42" fill="#f2f2f2" stroke="#999"/>

  <text x="260" y="444" font-size="13" fill="#666">Label: Categoria (select)</text>
  <rect x="260" y="454" width="370" height="42" fill="#f2f2f2" stroke="#999"/>
  <text x="600" y="480" font-size="12" fill="#999">▾</text>

  <rect x="260" y="515" width="150" height="46" fill="#f2f2f2" stroke="#999"/>
  <text x="290" y="543" font-size="13" fill="#777">[Cancelar]</text>
  <rect x="440" y="515" width="190" height="46" fill="#999" stroke="#666"/>
  <text x="475" y="543" font-size="13" fill="#fff">[Salvar]</text>

  <text x="20" y="580" font-size="11" fill="#aaa">* JS: valor numérico &gt; 0, descrição obrigatória, categoria obrigatória</text>
  <text x="380" y="580" font-size="11" fill="#aaa">(rejeita opção "Selecione...")</text>
</svg>
