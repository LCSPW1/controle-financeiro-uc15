  <text x="55" y="175" font-size="16" fill="#555">[marca / logo]</text>
  <line x1="55" y1="210" x2="290" y2="210" stroke="#999" stroke-width="2"/>
  <line x1="55" y1="230" x2="260" y2="230" stroke="#bbb" stroke-width="2"/>

  <!-- painel direito (form) -->
