  <text x="420" y="120" font-size="26" fill="#333">Criar conta</text>
  <line x1="420" y1="145" x2="620" y2="145" stroke="#ccc" stroke-width="1"/>

  <text x="420" y="180" font-size="13" fill="#666">Label: Nome completo</text>
  <rect x="420" y="190" width="420" height="42" fill="#f2f2f2" stroke="#999"/>

