  <text x="20" y="26" font-size="13" fill="#999">wireframe · 02 · cadastro.html</text>

  <!-- painel esquerdo (marca) -->
  <rect x="20" y="50" width="330" height="540" fill="#e3e3e3" stroke="#888" stroke-width="1.5"/>
