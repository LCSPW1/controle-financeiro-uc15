  <text x="420" y="555" font-size="13" fill="#777">Já tem conta? [Entrar] →</text>

  <text x="420" y="595" font-size="11" fill="#aaa">* validação JS: obrigatórios, e-mail válido, senha mín. 6 chars,</text>
