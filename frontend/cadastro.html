<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Criar conta — Controle Financeiro</title>
<link rel="stylesheet" href="css/reset.css">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/forms.css">
</head>
<body>

<div class="auth-shell">
  <aside class="auth-brand">
    <div class="mark">
      <div class="brand-mark" aria-hidden="true"></div>
      <span>Controle Financeiro</span>
    </div>

    <div class="tagline">
      <h2>Leva menos de um minuto para começar.</h2>
      <p>Crie sua conta e registre sua primeira movimentação agora mesmo.</p>
    </div>

  </aside>

  <main class="auth-form-side">
    <div class="auth-form-wrap">
      <h1>Criar conta</h1>
      <span class="text-muted">Preencha seus dados para começar a usar o sistema.</span>

      <div class="alert alert-error" id="alert-erro" role="alert"></div>

      <form id="form-cadastro" novalidate>
        <div class="field" id="field-nome">
          <label for="nome">Nome completo</label>
          <input type="text" id="nome" name="nome" placeholder="Maria Silva" autocomplete="name">
          <p class="error-message"></p>
        </div>

        <div class="field" id="field-email">
          <label for="email">E-mail</label>
          <input type="email" id="email" name="email" placeholder="voce@exemplo.com" autocomplete="username">
          <p class="error-message"></p>
        </div>

        <div class="field" id="field-senha">
          <label for="senha">Senha</label>
          <input type="password" id="senha" name="senha" placeholder="Mínimo de 6 caracteres" autocomplete="new-password">
          <p class="error-message"></p>
        </div>

        <div class="field" id="field-confirmar">
          <label for="confirmar">Confirmar senha</label>
          <input type="password" id="confirmar" name="confirmar" placeholder="Repita a senha" autocomplete="new-password">
          <p class="error-message"></p>
        </div>

        <button type="submit" class="btn btn-primary btn-block">Criar conta</button>
      </form>

      <p class="auth-switch">Já tem conta? <a class="link" href="index.html">Entrar</a></p>
    </div>
  </main>
</div>

<script src="js/storage.js"></script>
<script src="js/validation.js"></script>
<script src="js/cadastro.js"></script>
</body>
</html>
